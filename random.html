<!DOCTYPE html>
<html lang="ca" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Troba el Territori</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- D3.js and TopoJSON -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background: linear-gradient(-45deg, #3b82f6, #6366f1, #ec4899, #8b5cf6);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            touch-action: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        #map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .map-region {
            fill: rgba(255, 255, 255, 0.22);
            stroke: rgba(255, 255, 255, 0.65);
            stroke-width: 0.8px;
            stroke-linejoin: round;
            transition: fill 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.1s ease;
            cursor: pointer;
            transform-origin: center;
        }

        @media (hover: hover) {
            .map-region:hover {
                fill: rgba(255, 255, 255, 0.4);
            }
        }

        .map-region.correct {
            fill: rgba(34, 197, 94, 0.85) !important;
            stroke: rgba(255, 255, 255, 0.95);
            pointer-events: none;
        }

        @keyframes flashError {
            0%, 100% { fill: rgba(255, 255, 255, 0.22); transform: translateX(0); }
            30% { fill: rgba(239, 68, 68, 0.9); transform: translateX(-4px); }
            70% { fill: rgba(239, 68, 68, 0.9); transform: translateX(4px); }
        }

        .map-region.error {
            animation: flashError 0.4s ease;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-white select-none">

    <div id="map-container" class="flex items-center justify-center">
        <svg id="d3-canvas" class="w-full h-full"></svg>
    </div>

    <div class="absolute top-0 left-0 w-full p-4 md:p-6 z-10 flex flex-col md:flex-row justify-between items-center space-y-3 md:space-y-0 pointer-events-none">
        
        <!-- Target Banner -->
        <div class="glass-panel rounded-2xl px-5 py-2.5 flex flex-col items-center justify-center pointer-events-auto min-w-[180px]">
            <span class="text-[9px] uppercase tracking-[0.2em] opacity-75 font-bold mb-0.5">Troba</span>
            <span id="target-name" class="text-lg md:text-2xl font-extrabold tracking-tight text-white drop-shadow text-center leading-tight">
                Carregant...
            </span>
        </div>

        <!-- Mode Selector Icons/Buttons -->
        <div class="glass-panel rounded-full p-1.5 flex items-center space-x-1.5 pointer-events-auto">
            <button onclick="setMode('ccaa')" id="btn-ccaa" class="px-3.5 py-1.5 rounded-full text-xs font-bold tracking-wide transition-all bg-white/30 shadow text-white flex items-center space-x-1" title="Comunitats Autònomes">
                <span>CCAA</span>
            </button>
            <button onclick="setMode('prov')" id="btn-prov" class="px-3.5 py-1.5 rounded-full text-xs font-bold tracking-wide transition-all text-white/70 hover:text-white flex items-center space-x-1" title="Províncies">
                <span>Províncies</span>
            </button>
            <button onclick="setMode('com')" id="btn-com" class="px-3.5 py-1.5 rounded-full text-xs font-bold tracking-wide transition-all text-white/70 hover:text-white flex items-center space-x-1" title="Comarques Catalunya">
                <span>Comarques</span>
            </button>
        </div>
    </div>

    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 pointer-events-none">
        <div class="glass-panel rounded-full px-5 py-2.5 flex items-center space-x-4 pointer-events-auto">
            <!-- Timer -->
            <div id="timer-display" class="font-mono text-base font-bold w-16 text-center drop-shadow-sm">
                0.0s
            </div>
            
            <div class="w-px h-4 bg-white/30"></div>
            
            <!-- Minimal Reload Icon Button -->
            <button onclick="startRound()" class="text-white hover:text-green-300 transition-transform duration-200 active:scale-90 p-1" title="Tornar a jugar">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </div>

    <div id="end-overlay" class="absolute inset-0 bg-black/40 backdrop-blur-md z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel bg-white/20 rounded-3xl p-8 max-w-sm w-[90%] flex flex-col items-center text-center transform scale-95 transition-transform duration-300" id="end-modal">
            <div class="w-14 h-14 bg-green-400/20 text-green-300 rounded-full flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-3xl font-extrabold mb-1 tracking-tight drop-shadow-md">Completat</h2>
            <div class="font-mono text-4xl font-bold mt-3 mb-6 text-white drop-shadow-lg" id="final-time">0.0s</div>
            
            <button onclick="closeOverlayAndRestart()" class="w-full py-3 bg-white/25 hover:bg-white/35 border border-white/40 rounded-xl font-bold flex items-center justify-center space-x-2 transition-all active:scale-95 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span>Tornar a jugar</span>
            </button>
        </div>
    </div>

    <script>
        const MODES = {
            'ccaa': {
                url: 'https://raw.githubusercontent.com/jdefunes/topojsons/main/comunidades-autonomas-espanolas.json',
                type: 'topojson',
                topoObject: 'comunidades-autonomas-espanolas'
            },
            'prov': {
                url: 'https://raw.githubusercontent.com/jdefunes/topojsons/main/provincias-espanolas.json',
                type: 'topojson',
                topoObject: 'provincias-espanolas'
            },
            'com': {
                url: 'https://raw.githubusercontent.com/jatorre/GeoJSON-Catalunya/master/comarques.geojson',
                type: 'geojson'
            }
        };

        let currentMode = 'ccaa';
        let currentGeoJSON = null;
        let remainingRegions = [];
        let currentTarget = null;
        let foundRegions = new Set();
        
        let timerInterval = null;
        let startTime = null;
        let isPlaying = false;

        function getRegionName(properties) {
            if (!properties) return null;
            const keys = ['name', 'NAME_1', 'NAME_2', 'nombre', 'NOMBRE', 'nom_comar', 'NOM_COMAR', 'comarca', 'ccaa', 'provincia', 'prov'];
            for (let key of keys) {
                if (properties[key] && typeof properties[key] === 'string') {
                    let name = properties[key]
                        .replace(/Comunidad Autónoma de |Comunidad de |Comunidad Foral de |Región de |Provincia de /gi, '')
                        .trim();
                    return name;
                }
            }
            return null;
        }

        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        async function fetchMapData(mode) {
            const config = MODES[mode];
            try {
                const response = await fetch(config.url);
                if (!response.ok) throw new Error('Error al connectar amb el servidor de mapes');
                const data = await response.json();

                let geojson;
                if (config.type === 'topojson') {
                    // Fallback object key detection if standard topoObject differs
                    let objKey = config.topoObject;
                    if (!data.objects[objKey]) {
                        objKey = Object.keys(data.objects)[0];
                    }
                    geojson = topojson.feature(data, data.objects[objKey]);
                } else {
                    geojson = data;
                }

                // Filter valid named features
                geojson.features = geojson.features.filter(f => getRegionName(f.properties));
                return geojson;
            } catch (error) {
                console.error("Map load error:", error);
                document.getElementById('target-name').innerText = "Error de càrrega";
                return null;
            }
        }

        function renderMap() {
            if (!currentGeoJSON) return;

            const container = document.getElementById('map-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            const svg = d3.select("#d3-canvas")
                .attr("width", width)
                .attr("height", height);
            
            svg.selectAll("*").remove(); 

            // Standard Mercator projection fitting precisely to container
            const projection = d3.geoMercator();
            const padding = Math.min(width, height) * 0.08;
            projection.fitExtent([[padding, padding + 30], [width - padding, height - padding - 50]], currentGeoJSON);

            const path = d3.geoPath().projection(projection);

            svg.append("g")
                .selectAll("path")
                .data(currentGeoJSON.features)
                .enter()
                .append("path")
                .attr("d", path)
                .attr("class", d => {
                    const name = getRegionName(d.properties);
                    return foundRegions.has(name) ? "map-region correct" : "map-region";
                })
                .attr("data-name", d => getRegionName(d.properties))
                .on("click", handleRegionClick);
        }

        function handleRegionClick(event, d) {
            if (!isPlaying) return;

            const clickedName = getRegionName(d.properties);
            const element = event.currentTarget;

            if (clickedName === currentTarget) {
                d3.select(element).classed("correct", true).classed("error", false);
                foundRegions.add(clickedName);
                nextTarget();
            } else {
                d3.select(element).classed("error", false);
                void element.offsetWidth; // Trigger reflow for animation restart
                d3.select(element).classed("error", true);
            }
        }

        function nextTarget() {
            if (remainingRegions.length === 0) {
                endGame();
                return;
            }
            currentTarget = remainingRegions.pop();
            
            const targetEl = document.getElementById('target-name');
            targetEl.style.opacity = '0';
            setTimeout(() => {
                targetEl.innerText = currentTarget;
                targetEl.style.opacity = '1';
            }, 120);
        }

        function startRound() {
            if (!currentGeoJSON) return;
            
            isPlaying = true;
            foundRegions.clear();
            
            const allNames = Array.from(new Set(currentGeoJSON.features.map(f => getRegionName(f.properties))));
            remainingRegions = shuffleArray([...allNames]);
            
            d3.selectAll(".map-region").classed("correct", false).classed("error", false);
            document.getElementById('timer-display').innerText = '0.0s';
            
            if (timerInterval) clearInterval(timerInterval);
            startTime = Date.now();
            
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                document.getElementById('timer-display').innerText = elapsed.toFixed(1) + 's';
            }, 100);

            nextTarget();
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
            document.getElementById('final-time').innerText = finalTime;
            document.getElementById('target-name').innerText = "Perfecte!";
            
            const overlay = document.getElementById('end-overlay');
            const modal = document.getElementById('end-modal');
            overlay.classList.remove('pointer-events-none');
            overlay.classList.replace('opacity-0', 'opacity-100');
            modal.classList.replace('scale-95', 'scale-100');
        }

        function closeOverlayAndRestart() {
            const overlay = document.getElementById('end-overlay');
            const modal = document.getElementById('end-modal');
            
            overlay.classList.replace('opacity-100', 'opacity-0');
            modal.classList.replace('scale-100', 'scale-95');
            
            setTimeout(() => {
                overlay.classList.add('pointer-events-none');
                startRound();
            }, 300);
        }

        async function setMode(mode) {
            if (currentMode === mode && currentGeoJSON) return;
            
            // Update active styles on buttons
            ['ccaa', 'prov', 'com'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === mode) {
                    btn.className = "px-3.5 py-1.5 rounded-full text-xs font-bold tracking-wide transition-all bg-white/30 shadow text-white flex items-center space-x-1";
                } else {
                    btn.className = "px-3.5 py-1.5 rounded-full text-xs font-bold tracking-wide transition-all text-white/70 hover:text-white flex items-center space-x-1";
                }
            });

            currentMode = mode;
            document.getElementById('target-name').innerText = "Carregant...";
            
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timer-display').innerText = '0.0s';
            isPlaying = false;
            d3.select("#d3-canvas").selectAll("*").remove();

            currentGeoJSON = await fetchMapData(mode);
            if (currentGeoJSON) {
                renderMap();
                startRound();
            }
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (currentGeoJSON) renderMap();
            }, 200);
        });

        window.onload = () => {
            setMode('ccaa');
        };
    </script>
</body>
</html>
